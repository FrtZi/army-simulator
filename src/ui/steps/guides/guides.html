<section id="guides" class="card" aria-labelledby="guides-title">
  <h2 id="guides-title" data-text="guides.title"></h2>
  <p class="hint" data-text="guides.hint"></p>
  <div class="tabs guide-tabs" role="tablist" data-text-label="guides.title">
    <button
      type="button"
      role="tab"
      id="guide-tab-heroes"
      data-guide="heroes"
      aria-controls="guide-panel"
      data-text="guides.heroes"
    ></button>
    <button
      type="button"
      role="tab"
      id="guide-tab-rituals"
      data-guide="rituals"
      aria-controls="guide-panel"
      data-text="guides.rituals"
    ></button>
    <button
      type="button"
      role="tab"
      id="guide-tab-buildings"
      data-guide="buildings"
      aria-controls="guide-panel"
      data-text="guides.buildings"
    ></button>
    <button
      type="button"
      role="tab"
      id="guide-tab-champion"
      data-guide="champion"
      aria-controls="guide-panel"
      data-text="guides.champion"
    ></button>
  </div>
  <div id="guide-panel" class="guide-panel" role="tabpanel"></div>
</section>
