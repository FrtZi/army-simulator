<section id="setup" class="card" aria-labelledby="setup-title">
  <h2 id="setup-title" data-text="setup.title"></h2>
  <p class="hint" data-text="setup.hint"></p>
  <ul id="setup-summary" class="setup-tiles" data-text-label="setup.summary"></ul>
  <div class="setup-bar">
    <p id="setup-status" class="status" role="status"></p>
    <button id="setup-save" type="button" class="primary" data-text="setup.save"></button>
    <button id="setup-discard" type="button" data-text="setup.discard"></button>
  </div>
</section>

<section id="setup-files" class="card" aria-labelledby="setup-files-title">
  <h2 id="setup-files-title" data-text="setupfile.title"></h2>
  <p class="hint" data-text="setupfile.hint"></p>
  <div class="file-actions">
    <input id="setup-import" class="visually-hidden" type="file" accept="application/json,.json" />
    <label for="setup-import" class="button-like" data-text="setupfile.upload"></label>
    <button id="setup-export" type="button" data-text="setupfile.download"></button>
  </div>
  <p id="setup-files-status" class="status" role="status"></p>
  <div id="setup-review" aria-live="polite"></div>
  <details class="setup-help">
    <summary data-text="setupfile.help"></summary>
    <ol class="setup-ways">
      <li data-text="setupfile.wayHand"></li>
      <li data-text="setupfile.wayFile"></li>
      <li data-text="setupfile.wayAgent"></li>
    </ol>
    <p class="hint" data-text="setupfile.privacy"></p>
    <div class="file-actions">
      <button id="setup-brief-copy" type="button" data-text="setupfile.copyBrief"></button>
      <button id="setup-brief-download" type="button" data-text="setupfile.downloadBrief"></button>
      <button id="setup-template" type="button" data-text="setupfile.template"></button>
      <button id="setup-example" type="button" data-text="setupfile.example"></button>
      <button id="setup-dictionary-download" type="button" data-text="setupfile.dictionary"></button>
    </div>
  </details>
</section>

<section id="setup-warlords" class="card" aria-labelledby="setup-warlords-title">
  <h2 id="setup-warlords-title" data-text="setup.warlords"></h2>
  <p class="hint" data-text="setup.warlordsHint"></p>
  <div class="setup-add">
    <div class="field">
      <label for="setup-warlord-select" data-text="setup.addWarlord"></label>
      <select id="setup-warlord-select"></select>
    </div>
    <button id="setup-warlord-add" type="button" data-text="setup.add"></button>
  </div>
  <ul id="setup-warlord-list" class="army-list"></ul>
  <p id="setup-warlords-removed" class="hint"></p>
</section>

<section id="setup-capacity" class="card" aria-labelledby="setup-capacity-title">
  <h2 id="setup-capacity-title" data-text="setup.capacity"></h2>
  <div class="capacity-fields">
    <div class="field">
      <label for="setup-capacity-base" data-text="capacity.base"></label>
      <input id="setup-capacity-base" type="number" min="0" step="100" inputmode="numeric" />
    </div>
    <div class="field">
      <label for="setup-capacity-bonus" data-text="capacity.bonus"></label>
      <input id="setup-capacity-bonus" type="number" min="0" max="100" step="0.5" inputmode="decimal" />
    </div>
  </div>
  <p id="setup-capacity-total" class="capacity-total"></p>
</section>

<section id="setup-champion" class="card" aria-labelledby="setup-champion-title">
  <h2 id="setup-champion-title" data-text="setup.champion"></h2>
  <p class="hint" data-text="setup.championHint"></p>
  <div class="field">
    <label for="setup-champion-level" data-text="setup.championLevel"></label>
    <select id="setup-champion-level"></select>
  </div>
  <ul id="setup-champion-gear" class="setup-levels"></ul>
  <div id="setup-champion-figures" class="champion-figures"></div>
</section>

<section id="setup-rituals" class="card" aria-labelledby="setup-rituals-title">
  <h2 id="setup-rituals-title" data-text="setup.rituals"></h2>
  <p class="hint" data-text="setup.levelsHint"></p>
  <div class="field">
    <label for="setup-ritual-category" data-text="guides.category"></label>
    <select id="setup-ritual-category"></select>
  </div>
  <ul id="setup-ritual-list" class="setup-levels"></ul>
</section>

<section id="setup-buildings" class="card" aria-labelledby="setup-buildings-title">
  <h2 id="setup-buildings-title" data-text="setup.buildings"></h2>
  <p class="hint" data-text="setup.levelsHint"></p>
  <ul id="setup-building-list" class="setup-levels"></ul>
</section>
