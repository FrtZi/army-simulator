<section id="dashboards" class="card" aria-labelledby="dashboards-title">
  <h2 id="dashboards-title" data-text="dash.title"></h2>
  <p class="hint" data-text="dash.hint"></p>
  <div class="dash-tabs" role="tablist" data-text-label="dash.title">
    <button
      type="button"
      role="tab"
      id="dash-tab-efficiency"
      data-dash="efficiency"
      aria-controls="dash-panel"
      data-text="dash.efficiency"
    ></button>
    <button
      type="button"
      role="tab"
      id="dash-tab-rounds"
      data-dash="rounds"
      aria-controls="dash-panel"
      data-text="dash.rounds"
    ></button>
    <button
      type="button"
      role="tab"
      id="dash-tab-balance"
      data-dash="balance"
      aria-controls="dash-panel"
      data-text="dash.balance"
    ></button>
    <button
      type="button"
      role="tab"
      id="dash-tab-map"
      data-dash="map"
      aria-controls="dash-panel"
      data-text="dash.map"
    ></button>
    <button
      type="button"
      role="tab"
      id="dash-tab-pros"
      data-dash="pros"
      aria-controls="dash-panel"
      data-text="dash.pros"
    ></button>
    <button
      type="button"
      role="tab"
      id="dash-tab-raid"
      data-dash="raid"
      aria-controls="dash-panel"
      data-text="dash.raid"
    ></button>
  </div>
  <div id="dash-panel" class="dash-panel" role="tabpanel" tabindex="0" aria-labelledby="dash-tab-efficiency"></div>
</section>
