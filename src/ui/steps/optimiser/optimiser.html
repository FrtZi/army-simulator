<section id="optimiser" class="card" aria-labelledby="optimiser-title">
  <h2 id="optimiser-title" data-text="optimiser.title"></h2>
  <p class="hint" data-text="optimiser.hint"></p>
  <div class="field">
    <label for="optimiser-goal" data-text="optimiser.goal"></label>
    <select id="optimiser-goal"></select>
  </div>
  <div id="optimiser-opponent-field" class="field">
    <label for="optimiser-opponent" data-text="optimiser.opponent"></label>
    <select id="optimiser-opponent"></select>
  </div>
  <p class="hint" data-text="optimiser.aimHint"></p>
  <div class="filters" id="optimiser-aim"></div>
  <button id="optimiser-run" type="button" class="primary" data-text="optimiser.run"></button>
  <p id="optimiser-status" class="status" role="status"></p>
  <div id="optimiser-result"></div>
</section>
