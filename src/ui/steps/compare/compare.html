<section id="compare" class="card" aria-labelledby="compare-title">
  <h2 id="compare-title" data-text="compare.title"></h2>
  <p class="hint" data-text="compare.hint"></p>
  <div class="compare-choice">
    <div class="field">
      <label for="compare-a" data-text="compare.left"></label>
      <select id="compare-a" data-side="0"></select>
    </div>
    <div class="field">
      <label for="compare-b" data-text="compare.right"></label>
      <select id="compare-b" data-side="1"></select>
    </div>
  </div>
  <div id="compare-figures" class="table-wrap"></div>
  <div id="compare-battles" class="battles"></div>
</section>
