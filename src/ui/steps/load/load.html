<section id="load-setup" class="card" aria-labelledby="load-setup-title">
  <h2 id="load-setup-title" data-text="load.title"></h2>
  <div class="load-switch">
    <input id="load-setup-toggle" type="checkbox" role="switch" aria-describedby="load-setup-status" />
    <label for="load-setup-toggle" data-text="load.label"></label>
  </div>
  <p id="load-setup-status" class="hint"></p>
  <button id="load-setup-open" type="button" data-text="load.open"></button>
</section>
