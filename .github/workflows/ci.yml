name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # an explicit image: a new Ubuntu is a major upgrade, tried on a branch first (DEF-011); 26.04 since 2026-10-24
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # formatting, lint, data, engine, page and accessibility tests (builds dist/), HTML validation
      - run: npm run check
      # v3 runs on Node 24; v2 targeted Node 20, which GitHub has retired (DEF-011)
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
