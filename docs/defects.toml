[[defaut]]
id = "DEF-011"
date = 2026-10-23
titre = "CI warnings: gitleaks-action on Node 20, runner image about to change"
type = "third party"
etiquettes = ["ci"]
gravite = "minor"
statut = "fixed"
constat = "The first deploy's run warned that gitleaks-action@v2 targets the retired Node 20, and that ubuntu-latest moves to Ubuntu 26."
cause = "v2 was the major version in the workflow we started from; ubuntu-latest follows GitHub's choice of image; Dependabot had not run yet on the new repo."
solution = "gitleaks-action@v3 (Node 24, same inputs); runs-on pinned to ubuntu-24.04, the move to 26.04 on the roadmap."
resultat = "The run is free of these warnings; a new Ubuntu comes as a deliberate, tried upgrade."
preuve = [".github/workflows/ci.yml"]
lecon = "A floating label (latest) is a dependency upgrade nobody chose: pin it, and plan the move."
liens = ["SEC-02", "MAINT-01"]

