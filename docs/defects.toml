statut = "fixed"
constat = "Three times in one day, after a text was added to src/ui/texts, npm run dev answered 500 \"have no text\" on the page until it was restarted, though the build and the tests passed."
cause = "The page assembler imported the English text files statically: the dev server, a Node process running for hours, kept the modules it loaded at its start. The assembler also listed the text files itself, a second list to keep beside texts/index.js."
solution = "The assembler reads every en*.js of the source's texts folder at each assembly, each reading under its own module address, so Node loads it afresh; no list of files in it any more. A test edits a text file between two assemblies; another checks that texts/index.js imports every text file of the folder, in both languages."
resultat = "The dev server serves a text added while it runs; a new text file needs one line in texts/index.js, which a test checks."
preuve = ["tests/tooling.test.js"]
lecon = "A long-running process keeps what it loaded: what it must see change is read at each use, and tested by changing it between two uses."
liens = ["MAINT-01", "LANG-02"]

[[defaut]]
id = "DEF-034"
date = 2026-11-09
titre = "The import review scrolled sideways on a narrow screen"
type = "code"
etiquettes = ["page", "tests"]
gravite = "minor"
statut = "fixed"
constat = "In the browser at about 440 px wide, the review of an uploaded file made the whole page scroll sideways: a parked value's list kept its 10 rem beside a path such as bonuses[0].target.unitTypes[0], which has no space to break at. Seen in the browser before the commit."
cause = "The parked row's grid had two columns, one that would not shrink, and no phone layout; the phone-layout check (DEF-032) only looked at grids of four columns or more, and it counted repeat(4, 1fr) as two."
solution = "On a phone, a parked value's list goes under what was read; a line of the review breaks anywhere rather than overflow. The check counts repeat() columns and also asks a phone layout of any grid with a column that will not shrink below a width."
resultat = "No sideways scroll at a narrow width; the check fails without the parked row's phone layout."
preuve = ["tests/styles.test.js"]
lecon = "Same lesson as DEF-032, widened: a check that only knows one way a layout breaks lets the next one through; it was looked at in the browser, and the check grew with it."
liens = ["COMP-01", "CFG-05"]

[[defaut]]
id = "DEF-035"
date = 2026-11-09
titre = "A tick box drawn as a text field"
type = "code"
etiquettes = ["page"]
gravite = "minor"
statut = "fixed"
constat = "In the rituals' guide, the tick box \"With bonuses in battle only\" showed as a large empty field beside its words. Seen in the browser before the commit."
cause = "base.css gives every input the full width of its row and a field's height; each list of tick boxes undid it on its own (the filters, the pickers, the switch), and the new one did not."
solution = "base.css undoes it once for every tick box and radio button, with the accent when ticked; the three copies are gone. A test reads the stylesheets: the fields' width is undone for tick boxes, once, in base.css."
resultat = "Every tick box keeps its own size, the next one included; the test fails without the rule."
preuve = ["tests/styles.test.js"]
lecon = "A rule that every case must undo is a rule written too wide: narrow it where it is written, not in each case."
liens = ["COMP-01", "GUIDE-03"]

[[defaut]]
id = "DEF-036"
date = 2026-11-09
titre = "A setup of rituals and buildings only could not be loaded"
type = "code"
etiquettes = ["page"]
gravite = "minor"
statut = "fixed"
constat = "With only buildings saved in Your setup, \"Load your setup\" stayed greyed out and said nothing was saved: their bonuses never reached the lab. Caught by the new page test before the commit."
cause = "Whether something is saved was a list of the sections known when the switch was written (heroes, bonuses, capacity); the rituals and buildings, added later, were not in it."
solution = "Something is saved when any section of the setup holds anything, those to come included."
resultat = "A setup of buildings alone loads; the Herdstone's +15 % health reaches the infantry in the lab, and the test fails with the old list."
preuve = ["tests/setup-page.test.js"]
lecon = "A list of cases written in one place goes stale when a case is added elsewhere: ask the data, not a list."
liens = ["CFG-04", "BONUS-07"]

[[defaut]]
id = "DEF-037"
date = 2026-11-10
titre = "The champion's guide left out the gear's bonuses for its march"
type = "code"
etiquettes = ["page", "data"]
gravite = "minor"
statut = "fixed"
constat = "In the Guides, Vambraces of Gore showed a Khorne ranged attack and a lead production bonus, but not its first two lines in the game, the melee and ranged attack of the champion's march (+7 % at Epic); a set's march bonus showed as its raw id. Seen on the page against Frantz's screenshots of the forge."
cause = "The march bonuses got their own list in champion.json when D-30 applied them in battle; the guide, written before, kept reading a piece's general and other bonuses only, and named a bonus from those two lists."
solution = "The guide reads the three lists, the march's first as the game does, and names a march bonus \"Champion's march: <stat>\"."
resultat = "A piece and a set show every bonus by name; the test fails with the old reading."
preuve = ["tests/gear.test.js"]
lecon = "Splitting one list of data into two splits every reader of it: find them all when the data moves."
liens = ["GUIDE-03", "BONUS-06"]

[[defaut]]
id = "DEF-038"
date = 2026-11-10
titre = "An item's row showed a text key, and its detail left the gear out of what asks for it"
type = "code"
etiquettes = ["page", "translation"]
gravite = "minor"
statut = "fixed"
constat = "In the new items' tables, Iron's \"Asked by\" showed \"guides.gear\" beside Heroes, Rituals and Buildings; and its detail, under the row, listed the heroes, rituals and buildings that cost iron, not the gear pieces. Seen on the page before the commit."
cause = "The tag's text key is built from the block's kind (guides.<kind>), and the three older kinds had a text; the gear, added with the champion, had none, and t() shows a missing key as it is. The detail's list of what asks for an item was written before the gear had costs."
solution = "A text for the gear in both languages; the detail lists the gear pieces too. A test reads the tables for anything shaped like a key, and the gear among the blocks."
resultat = "Iron's row says Heroes, Rituals, Buildings, Gear; its detail lists the pieces; the test fails with either fault back."
preuve = ["tests/items.test.js"]
lecon = "A text key built from a value escapes the check that both languages hold the same keys: test the page for keys left showing."
liens = ["GUIDE-08", "GUIDE-04"]

