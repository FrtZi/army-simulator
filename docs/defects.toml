[[defaut]]
id = "DEF-006"
date = 2026-10-22
titre = "Scripted edits turned \"page.$$(\" into \"page.$(\""
type = "process"
etiquettes = ["tests"]
gravite = "minor"
statut = "fixed"
constat = "After a scripted edit, several page tests called page.$( where page.$$( was written, and failed."
cause = "The edit used String.replace with a replacement string, where \"$$\" stands for a single \"$\"."
solution = "Edits are made with split/join or a replacement function; the broken lines were restored."
resultat = "The tests read as written."
preuve = ["Rule: CLAUDE.md, scripted edits never use a replacement string"]
lecon = "A replacement string is a small language of its own: $$, $& and $1 are patterns."
reconstitue = true

