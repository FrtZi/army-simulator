date = 2026-10-23
titre = "A zoom box stayed on the chart when the pointer could not be captured"
type = "code"
etiquettes = ["charts"]
gravite = "minor"
statut = "fixed"
constat = "Browser check: when setPointerCapture threw (no active pointer), the zoom box was already drawn but the drag not recorded, so nothing removed the box."
