# Defect log: one entry per real defect (what cost time or may come back, and teaches something), in the
# format shared by all our projects. Entries follow each other
# (DEF-001, DEF-002…), are never renumbered, and are written with the fix, in the same commit.
#
# Fields: id, date, titre, type, etiquettes, gravite, statut, constat, cause, solution, resultat, preuve,
# and if needed lecon, liens, reconstitue.

[[defaut]]
id = "DEF-001"
date = 2026-10-22
titre = "\"Charger\" transcribed as a charge, when it is the carrying capacity"
type = "content"
etiquettes = ["data", "translation"]
gravite = "major"
statut = "fixed"
constat = "The unit sheets stat \"Charger\" was stored as charge (a combat charge bonus)."
cause = "The French game translates \"Load\" (carrying capacity) with the verb \"Charger\"; we read it as the noun \"charge\" without checking the English game."
solution = "Renamed load in data/game.json and data/units.json; labels fr \"Charger\", en \"Load\"."
resultat = "All 62 values match the Load of an English-language reference; the engine will not use it in combat."
preuve = ["Rule: a stat name is checked in the English game before any calculation uses it (decisions.md, D-08, D-09)"]
lecon = "A translated label can mislead: every stat is confirmed in both languages before it enters a calculation."

[[defaut]]
id = "DEF-002"
date = 2026-10-22
titre = "The chart's \"+\" button zoomed out"
type = "code"
etiquettes = ["charts", "page"]
gravite = "minor"
statut = "fixed"
constat = "Clicking \"+\" on a dashboard chart widened the view instead of narrowing it."
cause = "The click handler read button.dataset.action, while the buttons carry data-zoom: the action was undefined and fell through to the zoom-out branch."
solution = "The handler reads button.dataset.zoom, the attribute the markup sets."
resultat = "\"+\" halves both ranges; the page test counts fewer troops in view, then all 82 after \"Reset\"."
preuve = ["tests/page.test.js"]
lecon = "An attribute name written in two places (markup and handler) can drift: a page test that clicks the button catches it."
liens = ["DASH-01"]
reconstitue = true

