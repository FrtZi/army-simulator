[[defaut]]
id = "DEF-023"
date = 2026-10-23
titre = "The charts' per-troop figures are reachable by pointer only"
type = "code"
etiquettes = ["accessibility", "charts"]
gravite = "major"
statut = "fixed"
constat = "Accessibility review: on the three scatter charts, a troop's name and figures show on hover only; the chart is one image (role img) with a summary, so screen readers skip the dots' titles and the keyboard cannot reach them."
cause = "The charts were designed for the pointer; axe-core does not flag it, as the image has a name."
