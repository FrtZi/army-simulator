gravite = "minor"
statut = "fixed"
constat = "The first run of the warlords' data tests refused Gutrot Spume's Enemy Attack Debuff: its values go from −0.9 % to −37 %."
cause = "The test required every talent between 0 and 100 %; a debuff lowers the enemy, so its values are negative, and the data was right."
