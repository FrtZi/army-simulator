statut = "fixed"
constat = "Testing on a real account's setup, five of the champion's six pieces worn were the wrong ones: other pieces of the same slot, read from the small icons of the champion's screen. The army's figures, the champion's weight and the path's gear steps were all worked out on them for a day, until the player showed his forge."
cause = "The pieces were matched to the data by their icons on the champion's screen, which names none of them; nothing asked for the screens that name each piece."
solution = "The pieces worn and owned read from the forge's screens, which name each piece, its rarity and its bonuses; a piece is checked against the data's bonuses at its level before it is used."
resultat = "The six pieces worn and the fifteen owned now match the forge's screens, bonus for bonus; the gear chosen per army is planned on them (SIM-26)."
preuve = ["Rule: docs/spec/optimiser.md (SIM-26), a piece is read from the forge's screen that names it, its bonuses checked against the data, never from an icon alone"]
lecon = "An icon is a hint, not a reading: identify a game item from a screen that names it, and check its figures against the data before using it."
liens = ["SIM-24", "SIM-26"]

[[defaut]]
id = "DEF-058"
date = 2026-11-17
titre = "Settled again with other talents, an army kept troops beyond its capacity"
type = "code"
etiquettes = ["engine"]
gravite = "major"
statut = "fixed"
constat = "Choosing the champion's gear for a real account's army, the army settled again in it held 226,459 troops for 187,000 places: the talent raising the march capacity had been dropped for a combat talent."
cause = "Settling chose the talents with the troops already placed: an army over its capacity was scored with all its troops, so the capacity talent seemed worth nothing; nothing cut the troops to the places a talent choice gives."
solution = "Each talent choice is judged with its troops fitted to its places (cut from the least worth per place, or topped up), and the troops are cut to the places before they move."
resultat = "On that setup the capacity talent stays and every place is filled, no more (226,459 of 226,459); on a made-up score the test keeps the capacity talent, and fails without the fix (the attack talent, 150 troops for 100 places)."
preuve = ["tests/optimiser-free.test.js"]
lecon = "A score that does not check a limit cannot be trusted to choose what sets the limit: fit the army to its limit before scoring a change to that limit."
liens = ["SIM-05", "SIM-26"]

[[defaut]]
id = "DEF-059"
date = 2026-11-17
titre = "The search kept one pair of heroes beside every third: its places spent on one army"
type = "code"
etiquettes = ["engine"]
gravite = "minor"
statut = "fixed"
constat = "Naming the trios kept on the model's map, on a real account's setup: 18 of the 20 trios kept were the same two heroes beside any third, all within a tenth of a percent of one another, so twenty places studied one army."
cause = "The trios were kept by their score at a glance only: a pair that lifts every army leads beside any third hero, and every such trio scores alike, so they filled the beam."
solution = "The trios kept are the best at a glance with each pair of heroes in three of them at most (perPair, a setting); measured on that setup for the four goals, never worse, as fast, and once a better army (D-53)."
resultat = "On a made-up ranking the test keeps the trios in their order at a glance and turns away a pair's third and fourth; it fails without the cap (the pair kept every time)."
preuve = ["tests/optimiser-pictures.test.js"]
lecon = "A beam kept by score alone fills with near-copies when one part of a branch dominates: keep the branches different where they are alike at a glance."
liens = ["SIM-05", "SIM-27"]

[[defaut]]
id = "DEF-060"
date = 2026-11-17
titre = "A prototype stated a figure misread from its own histogram (406 trios tied, where 29 were)"
type = "process"
etiquettes = ["charts", "tooling"]
gravite = "minor"
statut = "fixed"
constat = "The single-graph prototype shown to Frantz said 406 trios were tied at 94.3 % where the kept ones were taken; drawing it again from the trail, 29 trios stood there, the 406 at about 90 %."
cause = "The probe binned the shares with an offset the prototype did not share, and the figure was read from a bin's count instead of counted from the scores themselves."
solution = "Every figure a prototype states is counted from the data it draws, by the same code that places it; the prototype was drawn again from the trail, every point computed beforehand."
resultat = "The prototype redrawn says 29 trios at 94.3 %, counted from the scores; the map built in the page counts its marks from the trail the same way."
preuve = ["Rule: a figure stated beside a picture is counted by the code that draws it, never read off another output."]
lecon = "A figure said to the user is checked against the data it comes from, not against a summary of it."
liens = ["SIM-22"]

[[defaut]]
id = "DEF-061"
date = 2026-11-17
titre = "A page-wide style squashed the search picture's bars"
type = "code"
etiquettes = ["charts", "page"]
gravite = "minor"
statut = "fixed"
constat = "In the browser, the search picture's bars stood as small blocks at every height instead of rising from their line; in the tests they looked right."
cause = "The bars took the class bar, which the forms' style already sizes (height 0.6rem): a browser applies a CSS height to an SVG rectangle over its own height attribute; jsdom draws nothing, so no test saw it."
solution = "The picture's bars take a class of their own (glance-bar); the test checks that no page-wide style gives a height to any of the picture's shapes."
resultat = "The bars rise from their line in the browser; the test fails with the old class (a height reaches the bar) and passes with the new one."
preuve = ["tests/optimiser-pictures.test.js"]
lecon = "An SVG shape's size can be taken by any page-wide class of the same name: name a picture's classes by the picture, and test that no style reaches its shapes."
liens = ["SIM-22"]

[[defaut]]
id = "DEF-062"
date = 2026-11-17
titre = "The PvE armies weighed about ten times their power: a squad's power taken for a troop's"
type = "third party"
etiquettes = ["data", "engine"]
gravite = "major"
statut = "fixed"
constat = "Comparing a real battle report against the rank 15 Greenskin Army with the tool: the game weighs the army at 130,000,000 and its 805,919 dead at 20,147,975; the tool weighed it at 1,700,000,000, and its dead at about 190 million."
cause = "The PvE import took cctools' squad power as each troop's power. It is a squad's: our troops have one power per troop for each tier (4, 10, 25, 60, 150, 300), and so do the PvE troops in the game (4,000,000 tier-3 troops at 25 and 500,000 tier-4 at 60 make the 130,000,000; 805,919 tier-3 dead at 25 make the 20,147,975)."
solution = "The import gives each PvE troop its tier's power, read from our troops; cctools' squad power is no longer kept. 41 of the 47 PvE troops change."
resultat = "The rank 15 Greenskin Army weighs 130,000,000 as in the game; the battle's power lost against it falls from about 190 million to 15.9 million, the report's 20.1 million within reach. The test fails without the fix (a tier-1 troop at 40, not 4)."
preuve = ["tests/pve.test.js"]
lecon = "A figure imported from a third party is checked against the game's own once it shows it: a battle report gives the power of both sides, and the dead."
liens = ["SIM-11", "SIM-25"]
