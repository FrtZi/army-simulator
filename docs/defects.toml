[[defaut]]
id = "DEF-008"
date = 2026-10-22
titre = "axe's empty result did not equal an empty array"
type = "environment"
etiquettes = ["accessibility", "tests"]
gravite = "minor"
statut = "fixed"
constat = "The accessibility test failed with no violation listed: [] was not deep-equal to []."
cause = "axe runs inside jsdom's window, so its array belongs to another realm: deepStrictEqual compares prototypes too."
solution = "The violations are copied into a plain array of the test's realm (Array.from)."
resultat = "The test fails on a real violation only."
preuve = ["tests/accessibility.test.js"]
lecon = "Objects made inside jsdom are not of the test's realm: copy them before a strict comparison."
reconstitue = true

[[defaut]]
id = "DEF-009"
date = 2026-10-22
titre = "The theme script threw where matchMedia does not exist"
type = "environment"
etiquettes = ["page", "tests"]
gravite = "minor"
statut = "fixed"
constat = "The theme script stopped with \"matchMedia is not a function\" when the page opened in jsdom; the tests did not notice, since jsdom only reports a page script's error to its console."
cause = "src/theme-init.js called window.matchMedia without checking it exists."
solution = "The script guards matchMedia; since 2026-10-23 the page tests fail on any error a page script throws while the page opens."
resultat = "The page opens without matchMedia; a page script that throws fails every page test."
preuve = ["tests/page.js"]
lecon = "jsdom swallows script errors: a test helper must turn them into failures, or they pass unseen."
liens = ["THEME-01"]
reconstitue = true

