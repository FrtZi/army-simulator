# Product backlog: the source of docs/backlog.md (generated by scripts/backlog.mjs, checked by the git hook
# and CI). One [[item]] per piece of work worth tracking; identifiers follow each other.
#
#   moscow     must | should | could | won't (won't this time: kept, not planned)
#   milestone  a [[milestone]] code below; a milestone with a release is reached when all its Musts are done
#   module     data | engine | storage | ui (the code's families), or "framework" (checks, hooks, CI, registers)
#   status     to do (no task ticked) | doing | done (every task ticked, every dependency done)
#   tasks      the to-do list, each line "[ ] …" or "[x] …"
#   features   the catalogue identifiers (docs/features.md) the item delivers, once they are catalogued
#   added      when the item entered the backlog: new requests are visible as such

[[milestone]]
code = "v1.0"
name = "Version 1.0, the troops"
release = "v1.0.0"
goal = """Every troop and defence of the game, the engine (bonuses, armies, power, battle), the page with its \
compositions, comparison, six dashboards and saves, published on GitHub Pages."""

[[milestone]]
code = "v1.1"
name = "Version 1.1, heroes and the player's setup"
release = "v1.1.0"
goal = """The warlords in a composition, at their level, their bonuses applied; what the player has in game \
entered once and kept, so a new composition starts from it."""

[[milestone]]
code = "v1.2"
name = "Version 1.2, rituals and the keep"
release = "v1.2.0"
goal = """The rituals entered once in the setup, their bonuses applied; an attack on a keep, with the \
defences' first round."""

[[milestone]]
code = "later"
name = "Later, ideas kept"
goal = "Validated as ideas, not planned yet: each one is reprioritised when a version is prepared."

